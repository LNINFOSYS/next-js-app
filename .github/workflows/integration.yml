name: Integration
on:
    push:
        branches: [ "main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy: 
            matrix:
                node-version: [14.x,16.x,18.x]

        steps:
            - name: checkout branch
              uses: actions/checkout@v4

            - name: use nodejs 
              uses: actions/setup-node@v3
              with:
                node-version: ${{ matrix.node-version }}
                cache: 'npm'
            - name: installing dependencies
              run: npm i
            
            - name: building app
              run: npm run build
    tests:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [14.x,16.x,18.x]

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v3
              with:
                node-version: ${{matrix.node-version}}
                cache: 'npm'
            - run: npm i 

            - run: npm run test




