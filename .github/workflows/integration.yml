# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI   #Name anything you want 

on:
  push:
    branches: [ "main" ]       #To run jobs on push request on main branch
  pull_request:
    branches: [ "main" ]       #To run jobs on pull request on main branch

jobs:
  build:

    runs-on: ubuntu-latest    #Telling to use the OS type by github while running jobs

    strategy:           #Used for different strategies(Check steps block below you will understand)
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4    #Tells github to checkout current branch
    - name: Use Node.js ${{ matrix.node-version }}   #Tells github to use node.js and its version(name are simple terms that we use to give names)
      uses: actions/setup-node@v4        #Tells github to set node.js first
      with:                               #Tells github what to do with above line like below line suggests to configure several node-version(Check strategy block above)
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm i       #Run used for running commands
    - run: npm run build

 #Now we make another job that define for testing
  build:

    runs-on: ubuntu-latest    #Telling to use the OS type by github while running jobs

    strategy:           #Used for different strategies(Check steps block below you will understand)
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4    #Tells github to checkout current branch
    - name: Use Node.js ${{ matrix.node-version }}   #Tells github to use node.js and its version(name are simple terms that we use to give names)
      uses: actions/setup-node@v4        #Tells github to set node.js first
      with:                               #Tells github what to do with above line like below line suggests to configure several node-version(Check strategy block above)
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm i       #Run used for running commands    
    - run: npm run test  #this time run test