# ✅ Node.js CI/CD Workflow
# This workflow installs dependencies, runs security scans, tests, and builds your Node.js project.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # ✅ Allows manual triggering

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint || echo "⚠️ Lint failed but continuing pipeline"

  security-check:
    name: Security Scans (Trivy + Gitleaks)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      # ✅ Install Trivy (vulnerability scanner)
      - name: Install Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y && sudo apt-get install -y trivy

      - name: Run Trivy File System Scan
        run: trivy fs --format json -o fs-report.json .

      # ✅ Install Gitleaks (secret scanner)
      - name: Install Gitleaks
        run: sudo apt install -y gitleaks

      - name: Run Gitleaks Secret Scan
        run: gitleaks detect --source . -r gitleaks-report.json -f json

      # ✅ Upload scan reports as artifacts (view in Actions UI)
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            fs-report.json
            gitleaks-report.json

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: security-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x] # ✅ Test build across Node versions
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build --if-present

      - name: Run Final Tests
        run: npm test
